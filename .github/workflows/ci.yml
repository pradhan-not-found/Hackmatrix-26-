name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check backend tests --select E9,F63,F7,F82
      - name: Run tests
        run: python -m unittest discover -s tests -v

  web:
    name: Web app tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webassure
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webassure/package-lock.json
      # ganache bundles the macOS-only fsevents package without marking it optional,
      # so the platform check is skipped here. Vercel's own install is unaffected.
      - run: npm ci --force
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || {
            grep -nE "not ok|Error|error|expected|actual|failed" test-output.txt | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }
      - run: npm run build
